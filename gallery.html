<script src="script.js"></script>
    <script>
        // Fungsi terjemahan bahasa
        function setLanguage(lang) {
            localStorage.setItem('site_lang', lang);
            document.querySelectorAll('[data-id]').forEach(el => {
                const textId = el.getAttribute('data-id');
                const textEn = el.getAttribute('data-en');
                if (lang === 'en' && textEn) {
                    el.innerText = textEn;
                } else if (textId) {
                    el.innerText = textId;
                }
            });
        }

        window.onload = function() {
            const savedLang = localStorage.getItem('site_lang') || 'id';
            setLanguage(savedLang);
            loadAllPhotoInteractions();
        };

        // Memuat status Suka & Komentar yang tersimpan
        function loadAllPhotoInteractions() {
            ['gallery3', 'gallery4', 'gallery5'].forEach(id => {
                let likesData = JSON.parse(localStorage.getItem('likes_' + id)) || { count: 0, liked: false };
                let likeCountEl = document.getElementById('like-count-' + id);
                if (likeCountEl) {
                    likeCountEl.innerText = likesData.count;
                    if (likesData.liked) {
                        document.getElementById('like-btn-' + id).innerHTML = '❤️ <span id="like-count-' + id + '">' + likesData.count + '</span> Suka';
                    }
                }

                let comments = JSON.parse(localStorage.getItem('comments_' + id)) || [];
                let commentContainer = document.getElementById('comments-' + id);
                if (commentContainer) {
                    if (comments.length === 0) {
                        commentContainer.innerHTML = '<span style="color: #998; font-style: italic; font-size: 0.75rem;">Belum ada komentar.</span>';
                    } else {
                        let html = '';
                        comments.forEach(c => {
                            html += `<div><strong>${c.name}:</strong> ${c.text}</div>`;
                        });
                        commentContainer.innerHTML = html;
                    }
                }
            });
        }

        // Fungsi Tombol Suka
        function toggleLike(id) {
            let likesData = JSON.parse(localStorage.getItem('likes_' + id)) || { count: 0, liked: false };
            if (likesData.liked) {
                likesData.count -= 1;
                likesData.liked = false;
                document.getElementById('like-btn-' + id).innerHTML = '🤍 <span id="like-count-' + id + '">' + likesData.count + '</span> Suka';
            } else {
                likesData.count += 1;
                likesData.liked = true;
                document.getElementById('like-btn-' + id).innerHTML = '❤️ <span id="like-count-' + id + '">' + likesData.count + '</span> Suka';
            }
            localStorage.setItem('likes_' + id, JSON.stringify(likesData));
        }

        // Fungsi Kirim Komentar Foto
        function postPhotoComment(id) {
            const input = document.getElementById('input-' + id);
            const text = input.value.trim();
            if (!text) return;

            let guestList = JSON.parse(localStorage.getItem('rowiy_guest_list')) || [];
            let authorName = guestList.length > 0 ? guestList[0].name : 'Pengunjung';

            let comments = JSON.parse(localStorage.getItem('comments_' + id)) || [];
            comments.push({ name: authorName, text: text });

            localStorage.setItem('comments_' + id, JSON.stringify(comments));
            input.value = '';
            loadAllPhotoInteractions();
        }
    </script>
