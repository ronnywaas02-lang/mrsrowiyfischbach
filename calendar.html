<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Event & Forum</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f6ef;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .event-container {
            background: #fff;
            border: 1px solid #F4E8B1;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            margin: 20px auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        input[type="text"] {
            width: 80%;
            padding: 8px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 15px;
            background-color: #AA8C2C;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #8f7422;
        }
    </style>
</head>
<body>

    <h1>Kalender & Event</h1>

    <!-- Kontainer Event Kupang -->
    <div class="event-container">
        <h3>Event Kupang</h3>
        <p>Silakan berikan suka atau komentar Anda pada event ini.</p>
        
        <!-- Tombol Suka -->
        <button onclick="toggleEventLike('event_kupang_25juli')">❤️ Suka (<span id="like-count-event_kupang_25juli">0</span>)</button>

        <!-- Kolom Komentar -->
        <div style="margin-top: 15px; text-align: left;">
            <h4>Komentar:</h4>
            <div id="comments-event_kupang_25juli" style="max-height: 150px; overflow-y: auto; margin-bottom: 10px;"></div>
            
            <input type="text" id="input-event_kupang_25juli" placeholder="Tulis komentar...">
            <br>
            <button onclick="postEventComment('event_kupang_25juli')">Kirim</button>
        </div>
    </div>

    <!-- PANGGIL SCRIPT TERPISAH (AMAN, TIDAK AKAN MUNCUL SEBAGAI TEKS DI LAYAR) -->
    <script src="script.js"></script>
</body>
</html>
